<form method="post" action="{% url 'update_application_status' application.id %}" class="d-inline-flex align-items-center gap-2 flex-wrap">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label class="visually-hidden" for="status-select-{{ application.id }}">Application status for {{ application.college.name }}</label>
    <select name="status" id="status-select-{{ application.id }}" class="form-select form-select-sm" style="min-width: 12rem;" onchange="this.form.submit()">
        {% for value, label in application_status_choices %}
        <option value="{{ value }}"{% if application.status == value %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</form>
