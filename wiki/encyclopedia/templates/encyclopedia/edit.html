{% extends "encyclopedia/layout.html" %}

{% block title %}
    Edit {{ title }}
{% endblock %}

{% block body %}
    <h1>Edit {{ title }}</h1>
    <form action="{% url 'edit' title=title %}" method="POST">
        {% csrf_token %}
        <div>
            <label for="content">Content:</label>
            <textarea name="content" id="content" rows="5" cols="20">{{ entry }}</textarea>
        </div>
        <br>
        <button type="submit">Save Changes</button>
    </form>
{% endblock %}
